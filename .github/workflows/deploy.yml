name: CI / CD - Test & Deploy to Toolforge

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to Toolforge API
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Toolforge Deployment API
        run: |
          if [ -z "${{ secrets.TOOLFORGE_DEPLOY_TOKEN }}" ]; then
            echo "TOOLFORGE_DEPLOY_TOKEN secret not configured yet. Skipping auto-deploy."
            exit 0
          fi

          echo "Triggering Toolforge Components Deployment..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.svc.toolforge.org/components/v1/tool/wikitimer/deployment?token=${{ secrets.TOOLFORGE_DEPLOY_TOKEN }}&force-run=true&force-build=true")
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d: -f2)

          echo "Response Status: $STATUS"
          echo "Response Body: $BODY"

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Toolforge deployment triggered successfully!"
          else
            echo "⚠️ Deployment API returned status $STATUS: $BODY"
            exit 1
          fi
